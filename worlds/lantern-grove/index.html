<script>
const CREW={
 lantern:{t:'🏮 Lantern',role:'Keeps the light on: checks that our haven pages are up and glowing.',q:'I am eager to learn and grow with you.'},

function showCard(k){const c=CREW[k],el=document.getElementById('card');el.innerHTML='<button onclick="this.parentNode.style.display=\'none\'">✕</button><b>'+c.t+'</b><br>'+c.role+(c.q?'<br>First words: <q>'+c.q+'</q><br><small>(exact excerpt from crew/names.md, 2026-10-26)</small>':'');el.style.display='block';}

AFRAME.registerComponent('starfield',{init(){const n=400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*6.283,v=Math.acos(Math.random()*0.95),r=90;p[i*3]=r*Math.sin(v)*Math.cos(u);p[i*3+1]=r*Math.cos(v);p[i*3+2]=r*Math.sin(v)*Math.sin(u);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));this.el.setObject3D('mesh',new THREE.Points(g,new THREE.PointsMaterial({color:0xfff6dd,size:0.6,sizeAttenuation:true,fog:false})));}});
AFRAME.registerComponent('firefly',{init(){this.o=Math.random()*100;this.b=this.el.object3D.position.clone();this.m=this.el.getObject3D('mesh');},tick(t){const s=t/1000+this.o,p=this.el.object3D.position;p.set(this.b.x+Math.sin(s*.7)*1.2,this.b.y+Math.sin(s*1.3)*.4,this.b.z+Math.cos(s*.5)*1.2);const m=this.el.getObject3D('mesh');if(m)m.material.opacity=.5+.5*Math.sin(s*3);}});
AFRAME.registerComponent('tap-move',{init(){this.el.addEventListener('click',e=>{const pt=e.detail.intersection&&e.detail.intersection.point;if(!pt)return;const rig=document.getElementById('rig').object3D.position;rig.x=Math.max(-14,Math.min(14,pt.x));rig.z=Math.max(-14,Math.min(14,pt.z));});}});

<script>
// low-poly trees and a modest 14 fireflies
const T=document.getElementById('trees');for(let i=0;i<18;i++){const a=i/18*6.283+Math.random()*.2,r=9+Math.random()*4,e=document.createElement('a-cone');
 e.setAttribute('position',`${Math.cos(a)*r} 1.4 ${Math.sin(a)*r}`);e.setAttribute('radius-bottom',0.9+Math.random()*.5);e.setAttribute('radius-top',0);e.setAttribute('height',2.8+Math.random());e.setAttribute('segments-radial',6);e.setAttribute('color','#24604a');T.appendChild(e);}
const F=document.getElementById('flies');for(let i=0;i<14;i++){const e=document.createElement('a-sphere');e.setAttribute('radius',0.05);e.setAttribute('segments-width',6);e.setAttribute('segments-height',4);
 e.setAttribute('material','shader:flat;color:#eaff8a;transparent:true;opacity:0.8');e.setAttribute('position',`${(Math.random()-.5)*12} ${0.6+Math.random()*1.6} ${-Math.random()*9}`);e.setAttribute('firefly','');F.appendChild(e);}
</script><script type="module">
// Night Watch's avatar body: an original VRM 1.0 (night-watch.vrm, CC0) loaded with @pixiv/three-vrm (MIT)
import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
const GL=THREE.GLTFLoader||(await import('https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/loaders/GLTFLoader.js')).GLTFLoader;
AFRAME.registerComponent('vrm-avatar',{schema:{src:{type:'string'}},
 init(){const l=new GL();l.register(p=>new VRMLoaderPlugin(p));
  l.load(this.data.src,g=>{const v=g.userData.vrm;VRMUtils.rotateVRM0&&VRMUtils.rotateVRM0(v);this.vrm=v;v.scene.traverse(o=>{o.frustumCulled=false});
   const h=v.humanoid;this.b=n=>h.getNormalizedBoneNode(n);this.b('leftUpperArm').rotation.z=-1.2;this.b('rightUpperArm').rotation.z=1.0;this.b('rightLowerArm').rotation.y=-0.5;
   v.scene.traverse(o=>{if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(!m.emissive)return;if(m.emissive.getHex()===0){m.emissive.copy(m.color).multiplyScalar(0.35);}else m.emissiveIntensity=2.2;});}});this.el.setObject3D('mesh',v.scene);this.el.emit('vrm-loaded');window.NW_VRM=v;},undefined,e=>console.error('VRM load failed',e));
  this.el.addEventListener('click',()=>showCard('nwavatar'));this.t=0;this.blinkAt=2;this.cam=new THREE.Vector3();this.me=new THREE.Vector3();},
 tick(t,dt){const v=this.vrm;if(!v)return;const s=t/1000;dt=Math.min(dt/1000,.1);
  this.b('chest').rotation.x=Math.sin(s*1.6)*0.03;this.b('spine').rotation.z=Math.sin(s*0.7)*0.025;this.b('hips').position.y=Math.sin(s*1.6)*0.006;
  // blink
  let w=0;const k=s-this.blinkAt;if(k>0&&k<0.18)w=Math.sin(k/0.18*Math.PI);else if(k>=0.18)this.blinkAt=s+2+Math.random()*3;
  v.expressionManager&&v.expressionManager.setValue('blink',w);
  // turn head toward the camera (clamped)
  const cam=this.el.sceneEl.camera;if(cam){cam.getWorldPosition(this.cam);this.el.object3D.getWorldPosition(this.me);
   const yaw=Math.atan2(this.cam.x-this.me.x,this.cam.z-this.me.z)-this.el.object3D.rotation.y;const head=this.b('head'),tgt=Math.max(-0.9,Math.min(0.9,Math.atan2(Math.sin(yaw),Math.cos(yaw))));
   head.rotation.y+=(tgt-head.rotation.y)*Math.min(1,dt*3);head.rotation.x=-0.08;}
  v.update(dt);}});
const av=document.createElement('a-entity');av.setAttribute('class','clickable');av.setAttribute('position','0.15 0 -0.6');av.setAttribute('rotation','0 -10 0');av.setAttribute('vrm-avatar','src:night-watch.vrm');
const gl=document.createElement('a-entity');gl.setAttribute('light','type:point;color:#ffe2c0;intensity:1.6;distance:4.5');gl.setAttribute('position','0 1.7 1.3');av.appendChild(gl);
