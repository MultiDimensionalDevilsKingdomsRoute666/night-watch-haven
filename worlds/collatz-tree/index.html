<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Collatz Tree — Night Watch Haven</title>
<!-- Original Night Watch build (CC0). A-Frame 1.8.0 (MIT) from the official CDN. Every number on this page is computed live in your browser. -->
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<style>
body{margin:0}
#ov{position:fixed;left:10px;top:10px;z-index:10;background:#040d0acc;color:#e6fff2;border:1px solid #2f7a5a;border-radius:10px;padding:8px 12px;font:14px system-ui,sans-serif;max-width:min(80vw,520px)}
#ov h1{font-size:16px;margin:0 0 4px;color:#9dffc8}#ov small{opacity:.85}
#ov input{width:9em;background:#06201a;color:#fff;border:1px solid #3fa07a;border-radius:6px;padding:4px 6px;font:14px system-ui}
#ov button,#ui button,#ui a{background:#0b2a20dd;color:#e6fff2;border:1px solid #3fa07a;border-radius:8px;padding:5px 9px;font:14px system-ui;text-decoration:none}
#info{margin-top:4px;color:#ffe9a0}
#ui{position:fixed;right:10px;bottom:60px;z-index:12;display:flex;gap:6px}
#card{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:13;display:none;background:#06140fee;color:#eefff6;border:1px solid #9dffc8;border-radius:12px;padding:12px 14px;font:14px/1.45 system-ui;max-width:min(92vw,460px)}
#card b{color:#9dffc8}#card button{float:right;background:#14402f;color:#fff;border:1px solid #3fa07a;border-radius:6px}
</style></head><body>
<div id="ov"><h1>🌱 Collatz Tree</h1><small>Every number from 1 to 2000 grows back to root 1. Drag to look.</small><br>
<form id="f" style="margin-top:6px"><input id="num" type="text" inputmode="numeric" placeholder="any number" value="27"> <button>Light its path</button></form><div id="info"></div></div>
<div id="ui"><a href="../lantern-grove/">🌙 Grove</a><button id="brule">❔ The rule</button></div>
<div id="card"></div>
<a-scene renderer="antialias:true;colorManagement:true" vr-mode-ui="enabled:true" fog="type:exponential;color:#020a08;density:0.03" background="color:#020a08" loading-screen="dotsColor:#9dffc8;backgroundColor:#020a08">
 <a-entity light="type:ambient;color:#8fbfa8;intensity:0.6"></a-entity>
 <a-circle radius="6" rotation="-90 0 0" color="#041510"></a-circle>
 <a-entity id="tree" position="0 0.05 -4"></a-entity>
 <a-entity position="-2.6 1.4 -2" rotation="0 35 0" class="clickable" id="sign">
  <a-plane width="1.3" height="0.9" material="color:#06201a;opacity:0.85;transparent:true;side:double"></a-plane>
  <a-entity id="signtext" position="0 0 0.01"></a-entity>
 </a-entity>
 <a-entity position="2.7 0 -1.6" rotation="0 -40 0" class="clickable" id="portal">
  <a-torus radius="0.6" radius-tubular="0.06" arc="180" position="0 1.6 0" material="color:#cdbbff;emissive:#8f8cff;emissiveIntensity:1.2"></a-torus>
  <a-plane width="1.15" height="1.6" position="0 0.8 0" material="color:#a99cff;opacity:0.2;transparent:true;side:double"></a-plane>
 </a-entity>
 <a-entity id="rig" position="0 0 0.4">
  <a-camera look-controls="touchEnabled:true;magicWindowTrackingEnabled:true" wasd-controls="acceleration:12" position="0 1.8 0">
   <a-entity cursor="fuse:false" raycaster="objects:.clickable;far:20" position="0 0 -1" geometry="primitive:ring;radiusInner:0.012;radiusOuter:0.02" material="color:#9dffc8;shader:flat;opacity:.7"></a-entity>
  </a-camera>
 </a-entity>
 <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable;far:30"></a-entity>
</a-scene>
<script src="collatz.js"></script><script src="../lantern-grove/kin-room.js"></script>
</body></html>
